<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>atividade Web</title>
    <style>
    a:link{
        color: blue;
    }
    a:visited{
        color: purple;
    }
    a.stl1:hover{
        color: green;
    }
    a.stl2:hover{
        font-size: 90px;
    }
    a.stl3:hover{
        background-color: yellow;
    }
    a.stl4:hover{
        font-family: "Times New Roman", Georgia, serif;
    }
    a.stl5:hover{
        border: 4px solid darkgreen;
    }
    a:active{
        color: darkorange;
    }
    </style>
</head>
<body>

    <p>2)</p>
    <div>
    <a class="stl1" href="">Muda de cor </a><hr />
    <a class="stl2" href="">Muda o tamanho da letras </a><hr />
    <a class="stl3" href="">Muda a cor de fundo </a><hr />
    <a class="stl4" href="">Muda o tipo de letra </a><hr />
    <a class="stl5" href="">Muda a borda </a>
    </div><!--troquei para div pois no meu tava dando um aviso de erro no <p>-->
    
</body>
</html>
